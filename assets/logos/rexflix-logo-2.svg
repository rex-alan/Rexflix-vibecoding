<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180">
  <!-- STYLE 2: Bold with strong drop shadow — cinematic Netflix-poster feel -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;display=swap');
    </style>
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset in="blur" dx="0" dy="6" result="shifted"/>
      <feFlood flood-color="#000" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="shifted" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <text x="450" y="138" text-anchor="middle"
        font-family="'Bebas Neue', 'Arial Black', Impact, 'Helvetica Neue', Arial, sans-serif"
        font-size="155" font-weight="900" letter-spacing="14"
        fill="#E50914" filter="url(#dropShadow)">REXFLIX</text>
</svg>
